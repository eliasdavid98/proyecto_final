volumes:
  postgres-data:
  kestra-data:
  mlflow-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d kestra -U kestra"]
      interval: 10s
      timeout: 10s
      retries: 10

  kestra:
    image: kestra/kestra:v2.0.10
    restart: unless-stopped
    user: "root"
    command: server standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${KESTRA_HOST_PORT:-8081}:8080"
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./data:/app/data:ro
    environment:
      API_IMAGE: ${API_IMAGE:-ghcr.io/eliasdavid98/pset4-pogo-api}:${IMAGE_TAG:-latest}
      SNOWFLAKE_URL: ${SNOWFLAKE_URL:-}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USERNAME: ${SNOWFLAKE_USERNAME:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SECRET_SNOWFLAKE_PASSWORD: ${SECRET_SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-RAW}
      SNOWFLAKE_GOLD_SCHEMA: ${SNOWFLAKE_GOLD_SCHEMA:-GOLD}
      SNOWFLAKE_OBT_TABLE: ${SNOWFLAKE_OBT_TABLE:-OBT_CUSTOMER_CHURN}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      ENV_API_IMAGE: ${API_IMAGE:-ghcr.io/eliasdavid98/pset4-pogo-api}:${IMAGE_TAG:-latest}
      ENV_SNOWFLAKE_URL: ${SNOWFLAKE_URL:-}
      ENV_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      ENV_SNOWFLAKE_USERNAME: ${SNOWFLAKE_USERNAME:-}
      ENV_SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      ENV_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      ENV_SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-RAW}
      ENV_SNOWFLAKE_GOLD_SCHEMA: ${SNOWFLAKE_GOLD_SCHEMA:-GOLD}
      ENV_SNOWFLAKE_OBT_TABLE: ${SNOWFLAKE_OBT_TABLE:-OBT_CUSTOMER_CHURN}
      ENV_SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${POSTGRES_PASSWORD}
        kestra:
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:${KESTRA_HOST_PORT:-8081}/

  spark:
    image: apache/spark:3.5.8-scala2.12-java17-python3-ubuntu
    profiles: ["spark"]
    restart: "no"
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - net.snowflake:spark-snowflake_2.12:3.1.3
      - /opt/spark-app/build_obt.py
    volumes:
      - ./spark:/opt/spark-app:ro
    environment:
      SNOWFLAKE_URL: ${SNOWFLAKE_URL:?Set SNOWFLAKE_URL in .env}
      SNOWFLAKE_USERNAME: ${SNOWFLAKE_USERNAME:?Set SNOWFLAKE_USERNAME in .env}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:?Set SNOWFLAKE_DATABASE in .env}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:?Set SNOWFLAKE_WAREHOUSE in .env}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_GOLD_SCHEMA: ${SNOWFLAKE_GOLD_SCHEMA:-GOLD}
      SNOWFLAKE_OBT_TABLE: ${SNOWFLAKE_OBT_TABLE:-OBT_CUSTOMER_CHURN}

  mlflow:
    build:
      context: .
      dockerfile: api/mlflow.Dockerfile
    restart: unless-stopped
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:*,127.0.0.1:*,host.docker.internal:*"
    ports:
      - "${MLFLOW_HOST_PORT:-5001}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${API_IMAGE:-ghcr.io/eliasdavid98/pset4-pogo-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_URI: ${MLFLOW_MODEL_URI:-models:/pset3-churn-classifier@champion}
      CHURN_DECISION_THRESHOLD: ${CHURN_DECISION_THRESHOLD:-0.5}
      PREDICTION_MODE: ${PREDICTION_MODE:-model}
      OBT_SNAPSHOT_ID: ${OBT_SNAPSHOT_ID:-}
      OBT_SOURCE_GOLD_TABLES: ${OBT_SOURCE_GOLD_TABLES:-FACT_CUSTOMER_CHURN,DIM_GEOGRAPHY,DIM_GENDER,DIM_AGE_BAND,DIM_PRODUCT_COUNT}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USERNAME: ${SNOWFLAKE_USERNAME:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_MONITORING_SCHEMA: ${SNOWFLAKE_MONITORING_SCHEMA:-MONITORING}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  registry-bootstrap:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${API_IMAGE:-ghcr.io/eliasdavid98/pset4-pogo-api}:${IMAGE_TAG:-latest}
    profiles: ["bootstrap"]
    depends_on:
      mlflow:
        condition: service_healthy
    command: ["python", "scripts/bootstrap_registry.py"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

  dashboard:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${API_IMAGE:-ghcr.io/eliasdavid98/pset4-pogo-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    depends_on:
      api:
        condition: service_started
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USERNAME: ${SNOWFLAKE_USERNAME:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_MONITORING_SCHEMA: ${SNOWFLAKE_MONITORING_SCHEMA:-MONITORING}
