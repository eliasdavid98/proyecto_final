id: pset4_reentrenamiento
namespace: pset4
description: >
  Reentrena el modelo challenger tras alerta de deriva/desempeño, compara contra
  champion en el lote más reciente y exige aprobación humana antes de promover.

inputs:
  - id: trigger_batch_id
    type: STRING
    defaults: "synthetic-week-07"
  - id: trigger_reason
    type: STRING
    defaults: "Caída sostenida de desempeño (2 lotes consecutivos < CV - 2*SD)"

tasks:
  - id: train_and_compare_challenger
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: "{{ envs.api_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0:0"
    commands:
      - >-
        python /app/src/reentrenar.py train
        --batch-id "{{ inputs.trigger_batch_id }}"
        --trigger-reason "{{ inputs.trigger_reason }}"
        --output-file "{{ workingDir }}/candidate.json"
    env:
      MLFLOW_TRACKING_URI: http://host.docker.internal:5001
      SNOWFLAKE_ACCOUNT: "{{ envs.snowflake_account }}"
      SNOWFLAKE_USERNAME: "{{ envs.snowflake_username }}"
      SNOWFLAKE_PASSWORD: "{{ secret('SNOWFLAKE_PASSWORD') }}"
      SNOWFLAKE_DATABASE: "{{ envs.snowflake_database }}"
      SNOWFLAKE_WAREHOUSE: "{{ envs.snowflake_warehouse }}"
      SNOWFLAKE_ROLE: "{{ envs.snowflake_role | default('') }}"
      SNOWFLAKE_GOLD_SCHEMA: "{{ envs.snowflake_gold_schema }}"
      SNOWFLAKE_OBT_TABLE: "{{ envs.snowflake_obt_table }}"
      SNOWFLAKE_MONITORING_SCHEMA: MONITORING
    outputFiles:
      - candidate.json

  - id: parse_candidate
    type: io.kestra.plugin.core.log.Log
    message: >
      Evaluación completada. Revisa candidate.json en Outputs antes de aprobar o
      rechazar la promoción en el siguiente paso.

  - id: human_approval
    type: io.kestra.plugin.core.flow.Pause
    onResume:
      - id: aprobar_promocion
        type: BOOL
        defaults: false
        description: "Marcar true para promover challenger a @champion; false para rechazar."
      - id: challenger_version
        type: STRING
        description: "Número de versión del challenger reportado en candidate.json"
      - id: challenger_run_id
        type: STRING
        description: "run_id de MLflow del challenger reportado en candidate.json"
      - id: motivo_decision
        type: STRING
        defaults: "Decisión revisada por equipo de datos tras comparar contra champion."

  - id: apply_promotion_decision
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: "{{ envs.api_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0:0"
    commands:
      - >-
        python /app/src/reentrenar.py decide
        --batch-id "{{ inputs.trigger_batch_id }}"
        --challenger-version "{{ outputs.human_approval.onResume.challenger_version }}"
        --challenger-run-id "{{ outputs.human_approval.onResume.challenger_run_id }}"
        --approve "{{ outputs.human_approval.onResume.aprobar_promocion }}"
        --reason "{{ outputs.human_approval.onResume.motivo_decision }}"
    env:
      MLFLOW_TRACKING_URI: http://host.docker.internal:5001
      SNOWFLAKE_ACCOUNT: "{{ envs.snowflake_account }}"
      SNOWFLAKE_USERNAME: "{{ envs.snowflake_username }}"
      SNOWFLAKE_PASSWORD: "{{ secret('SNOWFLAKE_PASSWORD') }}"
      SNOWFLAKE_DATABASE: "{{ envs.snowflake_database }}"
      SNOWFLAKE_WAREHOUSE: "{{ envs.snowflake_warehouse }}"
      SNOWFLAKE_ROLE: "{{ envs.snowflake_role | default('') }}"
      SNOWFLAKE_MONITORING_SCHEMA: MONITORING